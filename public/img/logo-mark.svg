<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vistaar mark">
  <defs>
    <linearGradient id="vl-people" x1="4" y1="6" x2="46" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4f6fb"/><stop offset="55%" stop-color="#8ab4ff"/><stop offset="100%" stop-color="#44506b"/>
    </linearGradient>
    <linearGradient id="vl-arrow2" x1="6" y1="58" x2="52" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4f6fb"/><stop offset="55%" stop-color="#a9c3f5"/><stop offset="100%" stop-color="#8ab4ff"/>
    </linearGradient>
    <linearGradient id="vl-loop" x1="10" y1="30" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8ab4ff"/><stop offset="100%" stop-color="#44506b"/>
    </linearGradient>
    <radialGradient id="vl-heart-bg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f4f6fb"/><stop offset="100%" stop-color="#c3d3f2"/>
    </radialGradient>
    <g id="vl-person">
      <ellipse cx="0" cy="1.1" rx="1.9" ry="2.9"/>
      <path d="M-1.2 -0.8 L-3.3 -4.0" stroke-width="1.9" stroke-linecap="round" fill="none"/>
      <path d="M1.2 -0.8 L3.3 -4.0" stroke-width="1.9" stroke-linecap="round" fill="none"/>
      <path d="M-0.85 3.3 L-2.3 5.6" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      <path d="M0.85 3.3 L2.3 5.6" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    </g>
  </defs>

  <!-- speech-bubble loop -->
  <path d="M13 51 a17.5 14 0 1 0 21 -25" fill="none" stroke="url(#vl-loop)" stroke-width="3.4" stroke-linecap="round"/>

  <!-- people, waving arms up -->
  <g fill="url(#vl-people)" stroke="url(#vl-people)">
    <use href="#vl-person" transform="translate(9 29) scale(2.0)"/>
    <circle cx="9" cy="23.2" r="2.6" fill="#f4f6fb" stroke="none"/>
    <use href="#vl-person" transform="translate(21 23) scale(1.7)"/>
    <circle cx="21" cy="18.1" r="2.21" fill="#eef2fb" stroke="none"/>
    <use href="#vl-person" transform="translate(31 17) scale(1.4)" opacity=".94"/>
    <circle cx="31" cy="12.9" r="1.82" fill="#c3d3f2" stroke="none"/>
  </g>

  <!-- growth arrow -->
  <path d="M7 58 L20 40 L27 44.5 L46.2 17.15" fill="none" stroke="url(#vl-arrow2)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="51.4,9.8 50.7,20.3 41.7,14.0" fill="#8ab4ff"/>

  <!-- like / love badges -->
  <circle cx="33" cy="53.5" r="6.2" fill="url(#vl-heart-bg)" stroke="#0a0d13" stroke-width="1"/>
  <path d="M33 58.35 C30.8 55.65 28.2 54.45 28.2 51.95 C28.2 49.95 30.1 48.65 31.6 49.75 C32.3 50.25 33 51.05 33 51.05 C33 51.05 33.7 50.25 34.4 49.75 C35.9 48.65 37.8 49.95 37.8 51.95 C37.8 54.45 35.2 55.65 33 58.35 Z" fill="#0a0d13"/>

  <circle cx="45.5" cy="55" r="6.8" fill="url(#vl-heart-bg)" stroke="#0a0d13" stroke-width="1"/>
  <g transform="translate(41.3 51.15) scale(0.35)" fill="#0a0d13">
    <path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.1-.23.14-.47.14-.73v-2z"/>
  </g>
</svg>
